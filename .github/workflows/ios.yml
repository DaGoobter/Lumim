name: Build iOS app

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    # GitHub's Mac machines sometimes have no capacity; try three pools at once and keep whichever finishes.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry Lumen.ipa Payload
          echo "Bundled frameworks and extensions:"; ls Payload/Lumen.app/Frameworks Payload/Lumen.app/PlugIns 2>/dev/null || true
          ls -la Lumen.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-ipa-${{ matrix.os }}
          path: Lumen.ipa
          retention-days: 14
