name: Build iOS app

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml', 'desktop/**', '.github/workflows/windows.yml', 'HuefinTV/**', '.github/workflows/tvos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's Mac machines sometimes have no capacity; try three pools at once and keep whichever finishes.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch Huefin's font (Bricolage Grotesque, SIL Open Font License)
        run: |
          mkdir -p Lumen/Fonts
          base="https://raw.githubusercontent.com/google/fonts/main/ofl/bricolagegrotesque"
          for name in "BricolageGrotesque%5Bopsz%2Cwdth%2Cwght%5D.ttf" "BricolageGrotesque%5Bopsz%2Cwght%5D.ttf"; do
            curl -fsSL -o Lumen/Fonts/BricolageGrotesque.ttf "$base/$name" && break
          done
          curl -fsSL -o Lumen/Fonts/OFL.txt "$base/OFL.txt" || true
          ls -la Lumen/Fonts || true
          [ -s Lumen/Fonts/BricolageGrotesque.ttf ] || { rm -f Lumen/Fonts/BricolageGrotesque.ttf; echo "Font not available; the app falls back to system type."; }

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          # Placeholder (ad-hoc) signature that declares the shared app group, so sideloading tools set it up
          # for the widget / Top Shelf when they re-sign. Nested code first, then extensions, then the app.
          APP=Payload/Lumen.app
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          [ -d "$APP/PlugIns/PrismActivity.appex" ] && codesign --force --sign - --entitlements PrismActivity/PrismActivity.entitlements "$APP/PlugIns/PrismActivity.appex"
          codesign --force --sign - --entitlements Lumen/Lumen.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -A3 -E "application-groups|keychain-access-groups" || true
          zip -qry Lumen.ipa Payload
          # Make sure the Huefin Engine (mpv) really made it into the app.
          if strings Payload/Lumen.app/Lumen | grep -q "target-colorspace-hint"; then echo "Huefin Engine: included"; else echo "::error::Huefin Engine (mpv) is missing from the app"; exit 1; fi
          echo "Bundled frameworks and extensions:"; ls Payload/Lumen.app/Frameworks Payload/Lumen.app/PlugIns 2>/dev/null || true
          ls -la Lumen.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-ipa-${{ matrix.os }}
          path: Lumen.ipa
          retention-days: 14

      - name: Publish to the "ios-latest" release (direct download link)
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Lumen.ipa Huefin.ipa
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --title "Huefin for iPhone and iPad (latest)" --notes "Newest iPhone/iPad build. Install Huefin.ipa with Sideloadly." --prerelease || true
          gh release upload ios-latest Huefin.ipa --clobber
