name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry Lumen.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-ipa
          path: Lumen.ipa
          retention-days: 14

  simulator:
    # Build for the iOS Simulator so it can run in a browser on appetize.io
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="x86_64 arm64" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Stage app
        run: |
          mkdir -p sim
          cp -R build/Build/Products/Release-iphonesimulator/Lumen.app sim/

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-simulator
          path: sim/
          retention-days: 14
