name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Fetch Huefin's font (Bricolage Grotesque, SIL Open Font License)
        run: |
          mkdir -p app/src/main/assets/fonts
          base="https://raw.githubusercontent.com/google/fonts/main/ofl/bricolagegrotesque"
          for name in "BricolageGrotesque%5Bopsz%2Cwdth%2Cwght%5D.ttf" "BricolageGrotesque%5Bopsz%2Cwght%5D.ttf"; do
            curl -fsSL -o app/src/main/assets/fonts/BricolageGrotesque.ttf "$base/$name" && break
          done
          [ -s app/src/main/assets/fonts/BricolageGrotesque.ttf ] || { rm -f app/src/main/assets/fonts/BricolageGrotesque.ttf; echo "Font not available; using system type."; }

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huefin-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish to the "android-latest" release (direct download link for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk Huefin.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Huefin for Android (latest)" --notes "Newest Android build. Download Huefin.apk on your phone and open it to install or update." --prerelease
          gh release upload android-latest Huefin.apk --clobber
