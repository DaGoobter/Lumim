name: Lumen
options:
  bundleIdPrefix: com.lumenplayer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.16
  VLCKitSPM:
    url: https://github.com/koombea/vlckit-spm
    from: 3.6.0
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    from: 4.8.0
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
      - path: Shared
    dependencies:
      - package: ZIPFoundation
      - package: VLCKitSPM
      - package: GoogleCast
      - target: PrismActivity
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Prism
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: Prism connects to Jellyfin servers on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PrismActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PrismActivity
      - path: Shared
    info:
      path: PrismActivity/Info.plist
      properties:
        CFBundleDisplayName: Prism
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.app.activity
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
