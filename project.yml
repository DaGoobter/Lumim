name: Lumen
options:
  bundleIdPrefix: com.lumenplayer
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.16
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    from: 4.8.0
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
      - path: Shared
    dependencies:
      - package: ZIPFoundation
      - package: MPVKit
        product: MPVKit
      - package: GoogleCast
      - target: PrismActivity
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Huefin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.huefin.links
            CFBundleURLSchemes: [huefin]
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: Huefin connects to Jellyfin servers on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Lumen/Lumen.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: HuefinIcon
  HuefinEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EngineTests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.app.enginetests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lumen.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lumen"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PrismActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PrismActivity
      - path: Shared
    info:
      path: PrismActivity/Info.plist
      properties:
        CFBundleDisplayName: Huefin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.app.activity
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PrismActivity/PrismActivity.entitlements
        SKIP_INSTALL: YES
  HuefinTV:
    type: application
    platform: tvOS
    sources:
      - path: HuefinTV
      - path: Lumen/Core
      - path: Lumen/Playback/AudioPlayer.swift
      - path: Lumen/Playback/DJVoice.swift
      - path: Lumen/Playback/Stations.swift
      - path: Lumen/Playback/SyncPlay.swift
      - path: Lumen/Playback/Engine.swift
      - path: Lumen/Playback/PlaybackPrefs.swift
      - path: Lumen/Playback/EnginePlayer.swift
      - path: Lumen/Playback/Trickplay.swift
      - path: Lumen/Playback/AppSubtitles.swift
      - path: Lumen/Playback/AssRenderer.swift
      - path: Lumen/UI/PINPad.swift
      - path: Lumen/Fonts
        optional: true
      - path: Lumen/Playback/MPVCore.swift
      - path: Lumen/Playback/NativeCore.swift
      - path: Lumen/Playback/EngineCore.swift
      - path: Shared/WatchShelf.swift
    dependencies:
      - package: MPVKit
        product: MPVKit
      - target: HuefinTopShelf
    info:
      path: HuefinTV/Info.plist
      properties:
        CFBundleDisplayName: Huefin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Automatic
        NSLocalNetworkUsageDescription: Huefin connects to Jellyfin servers on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleURLTypes:
          - CFBundleURLName: com.huefin.links
            CFBundleURLSchemes: [huefin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.tv
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HuefinTV/HuefinTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  HuefinTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: HuefinTopShelf
      - path: Shared/WatchShelf.swift
    info:
      path: HuefinTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Huefin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenplayer.tv.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: HuefinTopShelf/HuefinTopShelf.entitlements
schemes:
  HuefinTV:
    build:
      targets:
        HuefinTV: all
  Lumen:
    build:
      targets:
        Lumen: all
    test:
      config: Debug
      targets:
        - HuefinEngineTests

